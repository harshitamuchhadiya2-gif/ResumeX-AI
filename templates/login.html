{% extends "base.html" %}

{% block title %}Sign In &bull; ResumeX Pro{% endblock %}

{% block content %}

<div class="auth-wrapper">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to access your resume analysis dashboard and history.</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form" id="loginForm">
            <!-- Email -->
            <div class="form-group">
                <label class="form-label" for="loginEmail">Email Address</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input 
                        type="email" 
                        id="loginEmail"
                        name="email" 
                        class="styled-input"
                        placeholder="you@example.com" 
                        required
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="passwordInput">Password</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-key input-icon"></i>
                    <input 
                        type="password" 
                        id="passwordInput"
                        name="password" 
                        class="styled-input"
                        placeholder="Enter your password" 
                        required
                    >
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('passwordInput', this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account yet? <a href="{{ url_for('register') }}" class="auth-link">Create Account</a></p>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-regular fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fa-regular fa-eye';
        }
    }
</script>

{% endblock %}
