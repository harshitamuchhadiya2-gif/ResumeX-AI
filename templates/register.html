{% extends "base.html" %}

{% block title %}Create Account &bull; ResumeX Pro{% endblock %}

{% block content %}

<div class="auth-wrapper">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1>Create Free Account</h1>
            <p>Start optimizing your resumes with AI career intelligence.</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form" id="registerForm" onsubmit="return validateRegisterForm()">
            <!-- Name -->
            <div class="form-group">
                <label class="form-label" for="regName">Full Name</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input 
                        type="text" 
                        id="regName"
                        name="name" 
                        class="styled-input"
                        placeholder="Harshita Muchhadiya" 
                        required
                        minlength="2"
                    >
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="form-label" for="regEmail">Email Address</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input 
                        type="email" 
                        id="regEmail"
                        name="email" 
                        class="styled-input"
                        placeholder="you@example.com" 
                        required
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="regPassword">Password</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-key input-icon"></i>
                    <input 
                        type="password" 
                        id="regPassword"
                        name="password" 
                        class="styled-input"
                        placeholder="Create a strong password (min 6 chars)" 
                        required
                        minlength="6"
                    >
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('regPassword', this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-shield-check input-icon"></i>
                    <input 
                        type="password" 
                        id="confirmPassword"
                        class="styled-input"
                        placeholder="Re-enter your password" 
                        required
                    >
                </div>
                <div id="passwordMismatchMsg" class="form-error-text hidden">
                    <i class="fa-solid fa-circle-exclamation"></i> Passwords do not match.
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">
                <i class="fa-solid fa-rocket"></i> Create Account & Get Started
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Sign In</a></p>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-regular fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fa-regular fa-eye';
        }
    }

    function validateRegisterForm() {
        const p1 = document.getElementById('regPassword').value;
        const p2 = document.getElementById('confirmPassword').value;
        const msg = document.getElementById('passwordMismatchMsg');
        if (p1 !== p2) {
            msg.classList.remove('hidden');
            return false;
        }
        msg.classList.add('hidden');
        return true;
    }
</script>

{% endblock %}
